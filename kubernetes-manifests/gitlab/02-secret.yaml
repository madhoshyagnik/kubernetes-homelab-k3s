apiVersion: v1
kind: Secret
metadata:
  name: gitlab-oauth-secret
  namespace: gitlab
type: Opaque
stringData:
  # Replace with your Google OAuth credentials from Google Developer Console
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"
  # Optional: Initial root password (must be at least 8 characters)
  GITLAB_ROOT_PASSWORD: "GitLabAdminPassword123!"
