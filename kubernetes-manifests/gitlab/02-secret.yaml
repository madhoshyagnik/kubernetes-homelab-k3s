apiVersion: v1
kind: Secret
metadata:
  name: gitlab-oauth-secret
  namespace: gitlab
type: Opaque
stringData:
  # Google OAuth Credentials
  GOOGLE_CLIENT_ID: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "YOUR_GOOGLE_CLIENT_SECRET"

  # Optional: Initial root password
  GITLAB_ROOT_PASSWORD: "Gl_Homelab_2026_xK3s#9"

  # Optional: SMTP Email Configuration
  SMTP_ENABLED: "false"
  SMTP_ADDRESS: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER_NAME: "your_email@gmail.com"
  SMTP_PASSWORD: "your_app_password"
  SMTP_DOMAIN: "madhoshyagnik.com"
  SMTP_AUTHENTICATION: "login"
  SMTP_FROM_EMAIL: "gitlab@madhoshyagnik.com"
  SMTP_DISPLAY_NAME: "GitLab Homelab"
