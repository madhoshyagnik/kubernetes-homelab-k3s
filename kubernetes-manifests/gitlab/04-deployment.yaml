apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab-ce
          image: gitlab/gitlab-ce:17.9.1-ce.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: GITLAB_ROOT_PASSWORD
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'https://gitlab.madhoshyagnik.com'

                # Web and SSL configuration
                nginx['listen_https'] = false
                nginx['listen_port'] = 80
                gitlab_rails['gitlab_https'] = true

                # Google OAuth SSO configuration
                gitlab_rails['omniauth_enabled'] = true
                gitlab_rails['omniauth_allow_single_sign_on'] = ['google_oauth2']
                gitlab_rails['omniauth_block_auto_created_users'] = false
                gitlab_rails['omniauth_providers'] = [
                  {
                    "name" => "google_oauth2",
                    "app_id" => ENV['GOOGLE_CLIENT_ID'],
                    "app_secret" => ENV['GOOGLE_CLIENT_SECRET'],
                    "args" => { "access_type" => "offline", "approval_prompt" => "" }
                  }
                ]

                # Homelab performance tuning (reduces memory consumption)
                puma['worker_processes'] = 2
                puma['min_threads'] = 2
                puma['max_threads'] = 4
                sidekiq['concurrency'] = 10
                prometheus_monitoring['enable'] = false
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 2048Mi
            limits:
              cpu: 2000m
              memory: 3800Mi
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /-/liveness
              port: 80
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: gitlab-config
              mountPath: /etc/gitlab
            - name: gitlab-logs
              mountPath: /var/log/gitlab
            - name: gitlab-data
              mountPath: /var/opt/gitlab
      volumes:
        - name: gitlab-config
          persistentVolumeClaim:
            claimName: gitlab-config-pvc
        - name: gitlab-logs
          persistentVolumeClaim:
            claimName: gitlab-logs-pvc
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-data-pvc
