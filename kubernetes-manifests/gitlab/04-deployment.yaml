apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab-ce
          image: gitlab/gitlab-ce:17.9.1-ce.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: GITLAB_ROOT_PASSWORD
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: SMTP_ENABLED
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: SMTP_ENABLED
                  optional: true
            - name: SMTP_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: SMTP_ADDRESS
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: SMTP_USER_NAME
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: SMTP_PASSWORD
                  optional: true
            - name: SMTP_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: SMTP_DOMAIN
                  optional: true
            - name: SMTP_AUTHENTICATION
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: SMTP_AUTHENTICATION
                  optional: true
            - name: SMTP_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: SMTP_FROM_EMAIL
                  optional: true
            - name: SMTP_DISPLAY_NAME
              valueFrom:
                secretKeyRef:
                  name: gitlab-oauth-secret
                  key: SMTP_DISPLAY_NAME
                  optional: true
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'https://gitlab.madhoshyagnik.com'

                # Web and SSL configuration
                nginx['listen_https'] = false
                nginx['listen_port'] = 80
                gitlab_rails['gitlab_https'] = true

                # Google OAuth SSO configuration
                gitlab_rails['omniauth_enabled'] = true
                gitlab_rails['omniauth_allow_single_sign_on'] = ['google_oauth2']
                gitlab_rails['omniauth_block_auto_created_users'] = false
                gitlab_rails['omniauth_providers'] = [
                  {
                    "name" => "google_oauth2",
                    "app_id" => ENV['GOOGLE_CLIENT_ID'],
                    "app_secret" => ENV['GOOGLE_CLIENT_SECRET'],
                    "args" => { "access_type" => "offline", "approval_prompt" => "" }
                  }
                ]

                # SMTP Email configuration (optional)
                if ENV['SMTP_ENABLED'] == 'true'
                  gitlab_rails['smtp_enable'] = true
                  gitlab_rails['smtp_address'] = ENV['SMTP_ADDRESS'] || 'smtp.gmail.com'
                  gitlab_rails['smtp_port'] = (ENV['SMTP_PORT'] || 587).to_i
                  gitlab_rails['smtp_user_name'] = ENV['SMTP_USER_NAME']
                  gitlab_rails['smtp_password'] = ENV['SMTP_PASSWORD']
                  gitlab_rails['smtp_domain'] = ENV['SMTP_DOMAIN'] || 'madhoshyagnik.com'
                  gitlab_rails['smtp_authentication'] = ENV['SMTP_AUTHENTICATION'] || 'login'
                  gitlab_rails['smtp_enable_starttls_auto'] = true
                  gitlab_rails['smtp_tls'] = false
                  gitlab_rails['smtp_openssl_verify_mode'] = 'peer'
                  gitlab_rails['gitlab_email_from'] = ENV['SMTP_FROM_EMAIL'] || 'gitlab@madhoshyagnik.com'
                  gitlab_rails['gitlab_email_display_name'] = ENV['SMTP_DISPLAY_NAME'] || 'GitLab Homelab'
                  gitlab_rails['gitlab_email_reply_to'] = ENV['SMTP_FROM_EMAIL'] || 'noreply@madhoshyagnik.com'
                end

                # Homelab performance tuning (reduces memory consumption)
                puma['worker_processes'] = 2
                puma['min_threads'] = 2
                puma['max_threads'] = 4
                sidekiq['concurrency'] = 10
                prometheus_monitoring['enable'] = false
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 2048Mi
            limits:
              cpu: 2000m
              memory: 3800Mi
          readinessProbe:
            exec:
              command:
                - curl
                - -fsS
                - http://localhost:80/-/readiness
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 15
          livenessProbe:
            exec:
              command:
                - curl
                - -fsS
                - http://localhost:80/-/liveness
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 10
          volumeMounts:
            - name: gitlab-config
              mountPath: /etc/gitlab
            - name: gitlab-logs
              mountPath: /var/log/gitlab
            - name: gitlab-data
              mountPath: /var/opt/gitlab
      volumes:
        - name: gitlab-config
          persistentVolumeClaim:
            claimName: gitlab-config-pvc
        - name: gitlab-logs
          persistentVolumeClaim:
            claimName: gitlab-logs-pvc
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-data-pvc
