---
# Install MetalLB using Helm and wait until all components are ready.

- name: Add MetalLB Helm repository
  ansible.builtin.command: >
    helm repo add metallb https://metallb.github.io/metallb
  changed_when: false

- name: Update Helm repositories
  ansible.builtin.command: helm repo update
  changed_when: false

- name: Install MetalLB
  ansible.builtin.command: >
    helm upgrade --install metallb metallb/metallb
    --namespace metallb-system
    --create-namespace
    --wait
    --atomic

- name: Wait for MetalLB controller rollout
  ansible.builtin.command: >
    kubectl rollout status deployment/metallb-controller
    --namespace metallb-system
    --timeout=120s
  register: controller_rollout
  retries: 3
  delay: 5
  until: controller_rollout.rc == 0
  changed_when: false

- name: Wait for MetalLB speaker rollout
  ansible.builtin.command: >
    kubectl rollout status daemonset/metallb-speaker
    --namespace metallb-system
    --timeout=120s
  register: speaker_rollout
  retries: 3
  delay: 5
  until: speaker_rollout.rc == 0
  changed_when: false

- name: Wait for MetalLB webhook endpoint
  ansible.builtin.command:
    argv:
      - kubectl
      - get
      - endpoints
      - metallb-webhook-service
      - --namespace
      - metallb-system
      - -o
      - jsonpath={.subsets[0].addresses[0].ip}
  register: webhook
  retries: 20
  delay: 5
  until: webhook.stdout | length > 0
  changed_when: false