---
- name: Verify cluster connectivity
  ansible.builtin.command: kubectl cluster-info
  register: cluster_check
  changed_when: false
  failed_when: cluster_check.rc != 0

- name: Verify nodes are ready
  ansible.builtin.command: kubectl get nodes --no-headers
  register: node_check
  changed_when: false
  failed_when: node_check.stdout_lines | length == 0
